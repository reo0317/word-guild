<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>演出の見本（cinema.mjs）</title>
<style>
:root{--ink:#1f2a44;--paper:#f3ead8;--seal:#c8462f;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#131a2d;font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
#stage{position:relative;width:100%;max-width:430px;height:100dvh;max-height:932px;margin:0 auto;background:var(--paper);overflow:hidden;
 display:grid;align-content:center;gap:14px;padding:24px}
h1{margin:0 0 6px;font:900 20px var(--serif);color:var(--ink);letter-spacing:.1em;text-align:center}
fieldset{border:2px solid var(--ink);border-radius:6px;padding:12px;display:grid;gap:10px}
legend{font:900 13px var(--serif);color:var(--seal);padding:0 6px}
label{font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:center}
select{font-size:16px;padding:4px}
button{min-height:48px;border:0;border-radius:6px;background:var(--seal);color:var(--paper);font:900 16px var(--serif);letter-spacing:.1em}
p{margin:0;font-size:12px;color:#6f6a5c;line-height:1.6}
</style>
</head>
<body>
<div id="stage">
  <h1>演出の見本</h1>
  <fieldset><legend>手紙が完成した瞬間</legend>
    <label>区 <select id="ward"><option>1<option>2<option>3<option>4<option>5<option>6</select></label>
    <label><input type="checkbox" id="noscene"> 場面なし（scene: null）</label>
    <button id="letter">手紙の演出を見る</button>
  </fieldset>
  <fieldset><legend>区の門：白紙卿のカード</legend>
    <label>今回戻る行 <select id="line"><option value="0">1行目<option value="1">2行目<option value="2" selected>3行目<option value="3">4行目<option value="4">5行目<option value="5">6行目</select></label>
    <button id="gate">カードの演出を見る</button>
  </fieldset>
  <label><input type="checkbox" id="still"> 動きを省く（prefers-reduced-motion と同じ）</label>
  <p>途中でタップすると早送り。最後の状態でタップすると閉じる。手紙は story.json の shelf 1、場面の文は仮。</p>
</div>
<script type="module">
import {playLetterComplete, playGateCard} from '../../products/word-guild/guild/cinema.mjs';
const base = '../../products/word-guild/';
const story = await (await fetch(base + 'data/story.json')).json();
const stage = document.getElementById('stage'), $ = id => document.getElementById(id);
const scene = {title: '初日の手引き', lines: ['ハトリ局長のメモは、鞄の底に入っていた。', 'ツムギは宛名を一つずつ指でなぞる。', '坂の上で、窓がひとつ明るくなった。', '（この文は見本用の仮の文）']};
const still = () => $('still').checked || undefined;
const letter = () => playLetterComplete(stage, {letter: story.letters.find(l => l.shelf === 1), scene: $('noscene').checked ? null : scene, ward: +$('ward').value, base, reduced: still()});
const gate = () => { const n = +$('line').value; return playGateCard(stage, {lines: story.blank.slice(0, n + 1), newIndex: n, reduced: still()}); };
$('letter').onclick = letter;
$('gate').onclick = gate;
// 確認用：?play=letter&ward=3 / ?play=gate&n=2 / &still=1 / &noscene=1
const q = new URLSearchParams(location.search);
if (q.get('ward')) $('ward').value = q.get('ward');
if (q.get('n')) $('line').value = q.get('n');
$('still').checked = q.has('still'); $('noscene').checked = q.has('noscene');
if (q.get('play') === 'letter') letter().then(() => document.body.dataset.done = '1');
if (q.get('play') === 'gate') gate().then(() => document.body.dataset.done = '1');
</script>
</body>
</html>
