<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>霧晴れ郵便局 表紙の対案</title>
<style>
:root{--navy:#1f2a44;--paper:#f3ead8;--red:#c8462f;--mist:#9fb3bf;--lamp:#f2b84b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy)}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP",serif;color:var(--navy)}
.stage{position:relative;height:100vh;height:100dvh;max-width:calc(100dvh * 390 / 700);margin:0 auto;overflow:hidden;background:var(--paper)}
#art,#now{position:absolute;inset:0;width:100%;height:100%;display:block}
#now{object-fit:cover;object-position:50% 100%}
.stage[data-view="new"] #now,.stage[data-view="now"] #art{display:none}
.title{position:absolute;left:0;right:0;top:11.5%;text-align:center;margin:0;pointer-events:none}
.title h1{margin:0;font-size:min(11.6vw,6.4dvh);font-weight:800;letter-spacing:.1em;text-indent:.1em;line-height:1.15}
.title p{display:inline-flex;align-items:center;gap:.7em;margin:.9em 0 0;font-size:min(3.9vw,2.1dvh);font-weight:600;letter-spacing:.28em;text-indent:.28em}
.title p::before,.title p::after{content:"";width:1.6em;height:2px;background:var(--red)}
.switch{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden;background:var(--paper);font:600 12px/1 system-ui,sans-serif;z-index:2}
.switch button{appearance:none;border:0;background:none;color:var(--navy);padding:7px 12px;font:inherit;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.start{position:absolute;left:50%;bottom:max(4.2%,env(safe-area-inset-bottom));width:min(27vw,14dvh);aspect-ratio:1;transform:translateX(-50%) rotate(-4deg);border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));font-family:inherit}
.start svg{position:absolute;inset:0;width:100%;height:100%}
.start span{position:relative;color:var(--paper);font-size:min(4.6vw,2.4dvh);font-weight:800;letter-spacing:.08em}
.start:active{transform:translateX(-50%) rotate(-4deg) scale(.96)}
.fog{animation:drift 26s ease-in-out infinite alternate}
.f2{animation-duration:34s;animation-direction:alternate-reverse}
.f3{animation-duration:22s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.tw{opacity:0;animation:tw 5.5s ease-in-out infinite}
.t1{animation-delay:-1.7s;animation-duration:7s}.t2{animation-delay:-3.1s;animation-duration:6.2s}.t3{animation-delay:-4.4s;animation-duration:8s}
@keyframes tw{0%,100%{opacity:0}45%{opacity:.5}55%{opacity:.12}70%{opacity:.55}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 4.8s ease-in-out infinite}
.h2{animation-delay:-2s}
@keyframes halo{50%{transform:scale(1.14);opacity:.2}}
.beam{animation:beam 9s ease-in-out infinite}
@keyframes beam{50%{opacity:.6}}
.owl{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.fog,.tw,.halo,.beam,.owl,.eyes{animation:none}}
</style>
</head>
