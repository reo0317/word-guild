<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>紙魚 試作B</title>
<style>
:root{--navy:#1f2a44;--paper:#f3ead8}
body{margin:0;background:#e6d9bd;color:var(--navy);font:13px/1.4 "Hiragino Mincho ProN","Noto Serif JP",serif;padding:12px 16px}
h2{font-size:15px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.st{background:var(--paper);border:1.5px dashed #b8a98a;padding:3px 3px 1px;text-align:center}
.st svg{display:block;width:100%;height:auto}
.st b{display:block;font:600 10px/1.3 Georgia,serif;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.st.gold{background:#fbe6b4;border-color:#f2b84b}
.band{display:flex;gap:6px;background:#9fb3bf;padding:8px;border-radius:6px}
.band .st{flex:1}
.big{grid-column:span 2}
</style></head><body>
<h2>B：1区 街灯1</h2><div class="grid" id="p1"></div>
<h2>B：2区 街灯1</h2><div class="grid" id="p2"></div>
<h2>影 → 仮刷り → 本刷り → 金ぶち</h2><div class="grid" id="states"></div>
<h2>配達の帯（3体）</h2><div class="band" id="band"></div>
<h2>大物（13文字以上）・変わり種</h2><div class="grid" id="extra"></div>
<script type="module">
import {drawChara} from './b.mjs';
const words = await (await fetch('../../products/word-guild/data/words.json')).json();
const cats = await (await fetch('./sample.json')).json();
const odd = new Set(cats._odd ?? []);
const byId = Object.fromEntries(words.map(w => [w.id, {...w, cat: cats[w.id], odd: odd.has(w.id)}]));
const cell = (w, state = 'print', cls = '') => `<div class="st ${state === 'gold' ? 'gold' : ''} ${cls}">${drawChara(w, {state, inkTone: w.ch})}<b>${state === 'shadow' ? '？' : w.w}</b></div>`;
const page1 = words.filter(w => w.ch === 1 && w.shelf === 1).map(w => byId[w.id]);
const page2 = words.filter(w => w.ch === 2 && w.shelf === 7).map(w => byId[w.id]);
p1.innerHTML = page1.map(w => cell(w)).join('');
p2.innerHTML = page2.map(w => cell(w)).join('');
const sel = [byId.b0001, byId.t0019, byId.b0006];
states.innerHTML = sel.flatMap(w => ['shadow', 'proof', 'print', 'gold'].map(s => cell(w, s))).join('').replace(/^/, '') ;
states.style.gridTemplateColumns = 'repeat(4,1fr)';
band.innerHTML = [byId.b0010, byId.t0005, byId.b0015].map(w => cell(w)).join('');
const bigs = words.filter(w => w.w.length >= 13).slice(0, 4).map(w => ({...w, cat: 'work'}));
extra.innerHTML = bigs.map(w => cell(w, 'print', 'big')).join('') + cell(byId.b0004) + cell(byId.t0005) + cell(byId.b0004, 'gold') + cell(byId.t0005, 'shadow');
document.body.dataset.ready = '1';
</script></body></html>
