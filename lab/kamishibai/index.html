<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>紙芝居の試作</title>
  <style>
    body {
      margin: 0;
      padding: 24px 16px;
      color: #38241a;
      background: #fbefda;
      font: 17px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    h1 { margin: 0 0 24px; font-size: 1.6rem; }
    .choices { display: flex; justify-content: center; gap: 18px; }
    .choices button {
      width: 76px;
      height: 76px;
      padding: 0;
      border: 2px solid #af8050;
      border-radius: 50%;
      background: #542d20;
      color: #fff5dc;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>紙芝居の試作</h1>
    <div class="choices">
      <button id="scene" type="button">場面</button>
      <button id="letter" type="button">手紙</button>
    </div>
    <p id="status" role="status"></p>
  </main>
  <div id="player"></div>
  <script type="module">
    import { playKamishibai } from '../../products/word-guild/guild/kamishibai.mjs';

    const player = document.querySelector('#player');
    const status = document.querySelector('#status');
    const data = '../../products/word-guild/data/';
    let playing = false;

    async function load(name) {
      const response = await fetch(`${data}${name}.json`);
      if (!response.ok) throw new Error(`Could not load ${name}.json`);
      return response.json();
    }

    async function play(sceneMode) {
      if (playing) return;
      playing = true;
      status.textContent = '読み込み中…';
      try {
        const [script, source] = await Promise.all([
          load('kamishibai'), sceneMode ? load('scenes') : null
        ]);
        const cards = sceneMode
          ? script.scenes[1].map((card, i) => ({
            ...card,
            caption: source.scenes.find(scene => scene.shelf === 1).lines[i]
          }))
          : script.letters[1];
        status.textContent = '';
        await playKamishibai(player, { cards, sizes: script.sizes, trim: script.trim });
      } catch (error) {
        console.error(error);
        status.textContent = '紙芝居を読み込めませんでした。';
      } finally {
        playing = false;
      }
    }

    document.querySelector('#scene').addEventListener('click', () => play(true));
    document.querySelector('#letter').addEventListener('click', () => play(false));
  </script>
</body>
</html>
